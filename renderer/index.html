<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <!-- style-src permite inline: los templates propios pintan colores de labels/lanes vía style=""; no se inyecta CSS de terceros -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:; font-src 'self'" />
  <title>Monstro</title>
  <!-- El orden importa: es el mismo en el que estaban las secciones del CSS original y la cascada depende de él. -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/prs.css" />
  <link rel="stylesheet" href="css/history.css" />
  <link rel="stylesheet" href="css/milestones.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="stylesheet" href="css/widgets.css" />
  <link rel="stylesheet" href="css/releases.css" />
  <link rel="stylesheet" href="css/local.css" />
  <link rel="stylesheet" href="css/theme-glass.css" />
  <link rel="stylesheet" href="css/environments.css" />
  <link rel="stylesheet" href="css/validation.css" />
  <link rel="stylesheet" href="css/cognito.css" />
  <link rel="stylesheet" href="css/proposals.css" />
  <link rel="stylesheet" href="css/sessions.css" />
</head>
<body>
  <div id="splash">
    <svg id="splash-monster" viewBox="0 0 1024 1024" aria-hidden="true">
      <defs>
        <linearGradient id="sp-body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5ff0b8"/>
          <stop offset="1" stop-color="#23c98c"/>
        </linearGradient>
      </defs>
      <g class="sp-bob">
        <g class="sp-horns">
          <path d="M 372 332 L 322 196 L 452 312 Z" fill="#2b2f55"/>
          <path d="M 652 332 L 702 196 L 572 312 Z" fill="#2b2f55"/>
        </g>
        <rect x="292" y="296" width="440" height="452" rx="158" fill="url(#sp-body)"/>
        <ellipse cx="392" cy="748" rx="62" ry="40" fill="#23c98c"/>
        <ellipse cx="632" cy="748" rx="62" ry="40" fill="#23c98c"/>
        <g class="sp-eye">
          <circle cx="512" cy="468" r="126" fill="#ffffff"/>
          <circle cx="512" cy="480" r="60" fill="#2b2f55"/>
          <circle cx="542" cy="452" r="22" fill="#ffffff"/>
          <rect class="sp-lid" x="386" y="342" width="252" height="252" rx="40" fill="#34dd9c"/>
        </g>
        <path d="M 416 606 Q 512 700 608 606 Z" fill="#2b2f55"/>
        <path d="M 466 612 L 502 612 L 484 660 Z" fill="#ffffff"/>
        <path d="M 540 612 L 576 612 L 558 654 Z" fill="#ffffff"/>
      </g>
    </svg>
    <div class="splash-word">Monstro</div>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>

  <header id="topbar">
    <div class="traffic-pad"></div>
    <div class="brand" title="Monstro"><strong>Monstro</strong></div>
    <select id="repo-select" title="Repositorio" data-i18n-title="Repositorio"></select>
    <input id="search" type="search" placeholder="Filtrar…" data-i18n-placeholder="Filtrar…" />
    <button id="refresh" class="icon-btn" title="Refrescar (R)" data-i18n-title="Refrescar (R)"><svg class="lucide lucide-refresh-cw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button id="settings-btn" class="icon-btn" title="Ajustes" data-i18n-title="Ajustes"><svg class="lucide lucide-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
    <div id="me" class="me"></div>
  </header>

  <div id="layout">
    <nav id="sidebar">
      <button class="bucket" id="sessions-btn" title="Agents"><svg class="ico ico-agents" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>Agents <span class="count" id="sessions-count"></span></button>
      <div class="nav-group" data-tone="green">
        <div class="nav-section" data-i18n="Código">Código</div>
        <button class="bucket active" id="nav-prs-section" data-bucket="open" data-i18n="Merge requests"><svg class="ico ico-prs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/></svg>Merge requests <span class="count" id="count-open"></span></button>
        <div id="nav-validacion-section">
          <button class="bucket" id="bucket-validacion" data-i18n="Validación"><svg class="ico ico-validacion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m16 9-5.5 5.5L8 12"/></svg>Validación</button>
        </div>
        <div id="nav-historial-section">
          <button class="bucket" data-bucket="merged" data-i18n="Fusionadas"><svg class="ico ico-merged" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>Fusionadas</button>
          <button class="bucket" data-bucket="closed" data-i18n="Cerradas"><svg class="ico ico-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>Cerradas</button>
        </div>
        <div id="nav-repo-section">
          <button class="bucket" id="bucket-history" data-i18n="Grafo"><svg class="ico ico-graph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="3"/><path d="M5 9v6"/><circle cx="5" cy="18" r="3"/><path d="M12 3v18"/><circle cx="19" cy="6" r="3"/><path d="M16 15.7A9 9 0 0 0 19 9"/></svg>Grafo</button>
        </div>
      </div>
      <div class="nav-group" data-tone="accent">
        <div class="nav-section" data-i18n="Trabajo local">Trabajo local</div>
        <div id="nav-local-section">
          <button class="bucket" id="bucket-local-empezar" data-i18n="Empezar tarea"><svg class="ico ico-local-empezar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>Empezar tarea</button>
          <button class="bucket" id="bucket-local-crear" data-i18n="Crear tarea"><svg class="ico ico-local-crear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Crear tarea</button>
          <button class="bucket" id="bucket-local-vincular" data-i18n="Vincular tarea"><svg class="ico ico-local-vincular" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Vincular tarea</button>
          <button class="bucket" id="bucket-local-historico" data-i18n="Histórico"><svg class="ico ico-local-historico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>Histórico</button>
        </div>
      </div>
      <div class="nav-group" data-tone="yellow">
        <div class="nav-section" data-i18n="Planificación">Planificación</div>
        <div id="nav-milestones-section">
          <button class="bucket" id="bucket-milestones" data-i18n="Tareas por persona"><svg class="ico ico-milestone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>Tareas por persona</button>
          <button class="bucket" id="bucket-milestones-summary" data-i18n="Resumen"><svg class="ico ico-milestone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></svg>Resumen</button>
        </div>
        <div id="nav-propuestas-section">
          <button class="bucket" id="bucket-propuestas" data-i18n="Propuestas"><svg class="ico ico-propuestas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Propuestas</button>
        </div>
      </div>
      <div class="nav-group" data-tone="purple">
        <div class="nav-section" data-i18n="Entrega">Entrega</div>
        <div id="nav-releases-section">
          <button class="bucket" id="bucket-releases" data-i18n="Ramas"><svg class="ico ico-releases" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>Ramas</button>
          <button class="bucket" id="bucket-releases-publish" data-i18n="Publicar"><svg class="ico ico-releases" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h.01"/><path d="M3.3 11.3a2.4 2.4 0 0 0 0 3.4l6 6a2.4 2.4 0 0 0 3.4 0l8-8a2 2 0 0 0 .6-1.4V5a2 2 0 0 0-2-2h-5.3a2 2 0 0 0-1.4.6z"/></svg>Publicar</button>
          <button class="bucket" id="bucket-releases-pipelines" data-i18n="Pipelines"><svg class="ico ico-releases" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>Pipelines</button>
        </div>
        <div id="nav-entornos-section">
          <button class="bucket" id="bucket-entornos" data-i18n="Entornos"><svg class="ico ico-entornos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>Entornos</button>
        </div>
      </div>
      <div class="nav-group" data-tone="orange">
        <div class="nav-section" data-i18n="Soporte">Soporte</div>
        <div id="nav-support-section">
          <button class="bucket" id="bucket-support" data-i18n="Incidencias"><svg class="ico ico-support" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Incidencias</button>
          <button class="bucket" id="bucket-ops" data-i18n="Ops"><svg class="ico ico-ops" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>Ops</button>
        </div>
        <div id="nav-usuarios-section">
          <button class="bucket" id="bucket-usuarios" data-i18n="Usuarios"><svg class="ico ico-usuarios" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg>Usuarios</button>
        </div>
      </div>
    </nav>

    <aside id="sessions-pane" class="hidden"></aside>

    <main id="list-pane">
      <div id="pr-list"></div>
    </main>

    <aside id="detail-pane" class="hidden">
      <div id="detail-content"></div>
    </aside>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="settings-root" class="hidden"></div>

  <script src="graph.js"></script>
  <script src="highlight.js"></script>
  <!-- app.js troceado por feature (OPE-21): scripts clásicos en ámbito global compartido.
       core primero (estado/utilidades compartidas), boot último (arranque + listeners). -->
  <script src="app/icons.js"></script>
  <script src="app/core.js"></script>
  <script src="app/i18n.js"></script>
  <script src="app/drafts.js"></script>
  <script src="app/prlist.js"></script>
  <script src="app/detail.js"></script>
  <script src="app/changes.js"></script>
  <script src="app/actions.js"></script>
  <script src="app/history.js"></script>
  <script src="app/poll.js"></script>
  <script src="app/settings.js"></script>
  <script src="app/milestones.js"></script>
  <script src="app/milestones-summary.js"></script>
  <script src="app/support.js"></script>
  <script src="app/releases.js"></script>
  <script src="app/local.js"></script>
  <script src="app/local-history.js"></script>
  <script src="app/local-render.js"></script>
  <script src="app/local-form.js"></script>
  <script src="app/local-link.js"></script>
  <script src="app/local-start.js"></script>
  <script src="app/local-runs.js"></script>
  <script src="app/releases-publish.js"></script>
  <script src="app/releases-pipelines.js"></script>
  <script src="app/environments.js"></script>
  <script src="app/validation.js"></script>
  <script src="app/cognito.js"></script>
  <script src="app/proposals.js"></script>
  <script src="app/markdown.js"></script>
  <script src="app/sessions.js"></script>
  <script src="app/sessions-view.js"></script>
  <script src="app/sessions-local.js"></script>
  <script src="app/palette.js"></script>
  <script src="app/boot.js"></script>
</body>
</html>
